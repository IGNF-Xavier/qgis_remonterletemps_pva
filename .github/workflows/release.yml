name: Construire et publier le ZIP

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verification syntaxique
        run: python -m compileall -q remonter_le_temps

      - name: Construction du ZIP
        run: python scripts/build_zip.py

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip

      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
